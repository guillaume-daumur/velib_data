# Config Log4j2 pour le job PySpark (driver, mode local[2] et cluster).
# Reprend le niveau WARN par défaut de Spark, mais fait taire le warning
# récurrent et sans impact "KafkaDataConsumer is not running in
# UninterruptibleThread (KAFKA-1894)" qui pollue les logs à chaque batch.

rootLogger.level = warn
rootLogger.appenderRef.stdout.ref = console

appenders = console
appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_OUT
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yy/MM/dd HH:mm:ss} %p %c{1}: %m%n

loggers = kafkaConsumer
# Couvre toutes les classes du connecteur (org.apache.spark.sql.kafka010.KafkaDataConsumer
# en Spark 3.4, org.apache.spark.sql.kafka010.consumer.KafkaDataConsumer en 3.5+) sans
# dépendre du chemin exact de la classe, qui a bougé entre versions.
logger.kafkaConsumer.name = org.apache.spark.sql.kafka010
logger.kafkaConsumer.level = error
