# Config Log4j2 pour le broker Kafka (image officielle apache/kafka:latest).
# Garde le niveau INFO par défaut (utile pour le diagnostic au démarrage),
# mais fait taire deux sources de bruit sans intérêt en fonctionnement normal :
#  - AbstractConfig : dump complet de la config à chaque démarrage (~300 lignes)
#  - CoordinatorRuntime : "Scheduling/Finished loading of metadata" répété pour
#    chacune des 50 partitions __consumer_offsets à chaque (re)démarrage

rootLogger.level = info
rootLogger.appenderRef.stdout.ref = console

appenders = console
appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_OUT
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = [%d] %p %m (%c)%n

loggers = abstractConfig, coordinatorRuntime

logger.abstractConfig.name = org.apache.kafka.common.config.AbstractConfig
logger.abstractConfig.level = warn

logger.coordinatorRuntime.name = org.apache.kafka.coordinator.common.runtime.CoordinatorRuntime
logger.coordinatorRuntime.level = warn
